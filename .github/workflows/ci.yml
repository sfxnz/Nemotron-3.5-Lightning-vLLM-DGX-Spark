name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install pyyaml
      - run: python3 kit/recipe_lint.py .

  validate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run.sh dry-run with the shipped defaults
        run: VALIDATE_ONLY=1 ./run.sh
      - name: run.sh refuses a 1M window without FORCE_UNSAFE_CTX
        run: |
          if VALIDATE_ONLY=1 MAX_MODEL_LEN=1048576 ./run.sh; then
            echo "run.sh accepted MAX_MODEL_LEN=1048576 without FORCE_UNSAFE_CTX" >&2
            exit 1
          fi
      - name: run.sh override accepts 1M with FORCE_UNSAFE_CTX
        run: VALIDATE_ONLY=1 FORCE_UNSAFE_CTX=1 MAX_MODEL_LEN=1048576 ./run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning run.sh stop.sh kit/*.sh kit/probes/*.sh
